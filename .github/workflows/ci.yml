name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        shell: pwsh
        run: python -m ruff check build_exe.py seedance_gui.py watermark_remover.py test_seedance_gui.py scripts/generate_assets.py

      - name: Unit tests
        shell: pwsh
        run: python -m unittest test_seedance_gui.py

      - name: GUI self-test
        shell: pwsh
        run: python seedance_gui.py --self-test

      - name: Processing smoke test
        shell: pwsh
        run: python seedance_gui.py --smoke-process
