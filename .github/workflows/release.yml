name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONUTF8: "1"

jobs:
  build-windows-portable:
    name: Build Windows portable app
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Build and verify portable ZIP
        shell: pwsh
        run: python build_exe.py

      - name: Write SHA256 checksums
        shell: pwsh
        run: |
          $zip = "dist\SeedanceWatermarkRemover-Windows-x64-portable.zip"
          $exe = "dist\SeedanceWatermarkRemover\SeedanceWatermarkRemover.exe"
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          @(
            "$zipHash  SeedanceWatermarkRemover-Windows-x64-portable.zip",
            "$exeHash  SeedanceWatermarkRemover/SeedanceWatermarkRemover.exe"
          ) | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SeedanceWatermarkRemover-${{ github.ref_name }}-windows-x64
          if-no-files-found: error
          path: |
            dist/SeedanceWatermarkRemover-Windows-x64-portable.zip
            SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Seedance Watermark Remover ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/SeedanceWatermarkRemover-Windows-x64-portable.zip
            SHA256SUMS.txt
